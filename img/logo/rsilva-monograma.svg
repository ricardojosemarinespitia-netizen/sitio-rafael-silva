<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="R, monograma de RSILVA">
  <!--
    Monograma "R" · variante compacta (sello, avatar, marca de agua).
    Misma gramática que el wordmark: tubo monolíneo, panza de radio real,
    pata curvada y punto de soldadura en acento.

    El trazo sube de 6.5 a 7 sobre un lienzo de 64: a 16 px de alto el trazo
    del wordmark se adelgazaría por debajo de 1.5 px y el contraforma de la
    panza se cerraría. Aquí la panza deja 16 unidades de aire (4 px a 16 px),
    que es el mínimo para que la R se lea y no se vea como una mancha.
    Para el favicon usar `rsilva-favicon.svg`, que trae los colores fijados.
  -->
  <g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18.5 54 V10 h12 a11 11 0 0 1 0 22 H18.5"/>
    <path d="M30 32 C36.5 37 41.5 45.5 45 53.5"/>
  </g>
  <circle cx="45" cy="53.5" r="4" fill="var(--acento, currentColor)"/>
</svg>
