<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 64" width="192" height="64" role="img" aria-label="RSILVA">
  <!--
    RSILVA · logotipo (variante "tubo doblado")
    Letras trazadas como tubería de cobre monolínea: un solo grosor en todo el
    wordmark, extremos redondos (bocas de tubo cortado) y codos de radio real.
    La L es un codo de 90° con radio 12 — la firma del oficio. La pata de la R
    remata en un punto de soldadura, el único acento de color.

    ── GEOMETRÍA (por qué estas cifras) ────────────────────────────────────
    · Altura de mayúscula: y 12 → 52. Trazo 6.5, remate redondo.
    · Sobresalido óptico: las letras redondas y en punta pasan de la línea,
      si no se ven más cortas que las planas. S: 11.5 y 51.5. Vértice de la V:
      52.55 (baja de la base). Ápice de la A: 11.45 (sube de la mayúscula).
    · La S se construye con dos ARCOS reales (r 9.5 arriba, r 10.5 abajo), no
      con bézier a ojo: el radio desigual es lo que evita la S "de globo".
    · Interletra óptica, no métrica: 8 tras la R, 7 entre astas rectas
      (S·I·L) y 5 junto a las diagonales (V, A), que ya traen su propio
      blanco. Medida entre bordes visibles del trazo, no entre ejes.
    · Márgenes del lienzo: 6.75 a izquierda y derecha, 8.2 arriba y abajo.
  -->
  <g fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- R : asta + panza de radio 10, y la pata como tubo curvado -->
    <path d="M10 52 V12 h10 a10 10 0 0 1 0 20 H10"/>
    <path d="M20 32 C26 36.5 30.5 43.5 32.5 51.2"/>
    <!-- S : dos arcos de tubo, el de abajo más abierto que el de arriba -->
    <path d="M60.72 14.28 A9.5 9.5 0 1 0 54 30.5 A10.5 10.5 0 1 1 46.58 48.42"/>
    <!-- I -->
    <path d="M78 12 V52"/>
    <!-- L : codo de tubería a 90° con radio real de 12 -->
    <path d="M91.5 12 V40 A12 12 0 0 0 103.5 52 H112"/>
    <!-- V : vértice doblado, no cortado -->
    <path d="M124.5 12 L134.94 50.6 Q136 54.5 137.06 50.6 L147.5 12"/>
    <!-- A : ápice doblado + travesaño a la altura del codo de la L -->
    <path d="M159 52 L169.44 13.4 Q170.5 9.5 171.56 13.4 L182 52"/>
    <path d="M162.25 40 H178.75"/>
  </g>
  <!-- Punto de soldadura: el único acento de color de toda la marca -->
  <circle cx="32.5" cy="51.2" r="3.7" fill="var(--acento, currentColor)"/>
</svg>
